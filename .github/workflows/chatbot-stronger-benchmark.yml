name: Benchmark stronger chatbot models

on:
  push:
    branches: [chatbot-benchmark]

permissions:
  contents: read

concurrency:
  group: chatbot-stronger-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen3-1.7b-q4
            file: Qwen3-1.7B-Q4_K_M.gguf
            url: https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/d7f544eead698dbd1f15126ef60b45a1e1933222/Qwen3-1.7B-Q4_K_M.gguf
            sha256: b139949c5bd74937ad8ed8c8cf3d9ffb1e99c866c823204dc42c0d91fa181897
          - name: qwen3-4b-q4
            file: Qwen3-4B-Q4_K_M.gguf
            url: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf
            sha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
    env:
      LLAMA_TAG: b12814
      LLAMA_SHA256: c1d9820582e612c48b7842b6f85c1fec44000d012eab98d8b7afcc391768432b
      MODEL_FILE: ${{ matrix.file }}
      MODEL_URL: ${{ matrix.url }}
      MODEL_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify both pinned inputs
        run: |
          mkdir -p .chat-benchmark/runtime
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 450 --output ".chat-benchmark/$MODEL_FILE" "$MODEL_URL"
          runtime_url="https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/llama-$LLAMA_TAG-bin-ubuntu-x64.tar.gz"
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 120 --output .chat-benchmark/runtime.tar.gz "$runtime_url"
          printf '%s  %s\n' "$MODEL_SHA256" ".chat-benchmark/$MODEL_FILE" "$LLAMA_SHA256" .chat-benchmark/runtime.tar.gz | sha256sum -c -
          tar -xzf .chat-benchmark/runtime.tar.gz -C .chat-benchmark/runtime

      - name: Benchmark the native app wrapper on synthetic conversations
        run: |
          cli=$(find .chat-benchmark/runtime -type f -name llama-completion -print -quit)
          test -x "$cli"
          PYTHONPATH=backend python -B -m ml.benchmark_stronger_chatbot \
            --model ".chat-benchmark/$MODEL_FILE" --cli "$cli" \
            --out chatbot-benchmark-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: chatbot-benchmark-${{ matrix.name }}
          path: chatbot-benchmark-report.json
          if-no-files-found: error
          retention-days: 14
